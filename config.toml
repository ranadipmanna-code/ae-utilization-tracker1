# Streamlit's OWN chrome (native widgets, buttons, the data-grid canvas, menus)
# is themed here. The in-app Light/Dark toggle restyles everything else via
# injected CSS, but these keys drive components Streamlit renders itself,
# which that CSS can't reliably reach -- most visibly the sidebar buttons.
#
# Values mirror THEMES["light"] in app.py -- keep the two in step.
# Palette follows the anudip.org identity: the logo teal as the primary
# accent, deep navy ink, warm paper-white canvas.
#
# CRITICAL: this file MUST live at .streamlit/config.toml. Streamlit does NOT
# read a config.toml at the repository root. When it's missing here, Streamlit
# falls back to its DEFAULT DARK theme for native widgets -- which is why the
# Refresh button rendered black no matter what CSS was injected. The button is
# a native widget; primaryColor below is what actually colours it.
[theme]
base = "light"
primaryColor = "#14b8a6"            # Anudip logo teal — buttons, focus, checkboxes
backgroundColor = "#fbfaf8"         # warm paper white
secondaryBackgroundColor = "#ffffff"
textColor = "#16283c"               # Anudip navy ink
font = "sans serif"

[server]
# Claims are small writes; no need for the 200 MB default.
maxUploadSize = 10
