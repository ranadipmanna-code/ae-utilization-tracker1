name: CMIS Directory Snapshot

# Refreshes cmis_trainer_directory in Anudip_AE_Team with the full CMIS
# trainer roster (all dates), used by the admin email-reconciliation report.
# Keeps live CMIS creds in GitHub Actions only — never in Streamlit.

on:
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours, at :15
  workflow_dispatch: {}

concurrency:
  group: cmis-health
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "sqlalchemy==2.0.43" "pymysql==1.1.1" "cryptography==45.0.5" "pandas==2.3.1"

      - name: Run CMIS directory snapshot
        env:
          CMIS_HOST:      ${{ secrets.CMIS_HOST }}
          CMIS_PORT:      ${{ secrets.CMIS_PORT }}
          CMIS_USER:      ${{ secrets.CMIS_USER }}
          CMIS_PASSWORD:  ${{ secrets.CMIS_PASSWORD }}
          CMIS_DB:        ${{ secrets.CMIS_DB }}
          APPDB_HOST:     ${{ secrets.APPDB_HOST }}
          APPDB_PORT:     ${{ secrets.APPDB_PORT }}
          APPDB_USER:     ${{ secrets.APPDB_USER }}
          APPDB_PASSWORD: ${{ secrets.APPDB_PASSWORD }}
          APPDB_DB:       ${{ secrets.APPDB_DB }}
        run: python snapshot_cmis_directory.py
